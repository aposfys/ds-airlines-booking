name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend — pytest
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    # A real PostgreSQL, not a stand-in. The Phase 0 suite ran against an
    # in-memory fake, so passing tests were evidence about our logic and not
    # about the database; ADR-001 retired it.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: dsairlines
          POSTGRES_PASSWORD: dsairlines
          POSTGRES_DB: dsairlines_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dsairlines"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - run: pip install -r requirements.txt

      # The test fixtures build the schema by running the migrations, so this
      # also proves the migration chain applies cleanly on every run.
      - name: Run tests
        env:
          SECRET_KEY: ci-secret-key-not-used-for-anything-real-000
          TEST_DATABASE_URL: postgresql+asyncpg://dsairlines:dsairlines@localhost:5432/dsairlines_test
        run: pytest -q

      # Guards the migration-drift risk named in ADR-001: if the models and
      # the revision chain disagree, autogenerate would find work to do.
      - name: Check for migration drift
        env:
          SECRET_KEY: ci-secret-key-not-used-for-anything-real-000
          DATABASE_URL: postgresql+asyncpg://dsairlines:dsairlines@localhost:5432/dsairlines_test
        run: |
          alembic upgrade head
          alembic check

  frontend:
    name: Frontend — lint, typecheck, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm run lint
      # `npm run build` runs `tsc -b` first, so this covers typechecking.
      - run: npm run build
      - name: Component tests
        run: npm run test

  accessibility:
    name: Brand — palette contrast
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      # Fails the build if any shipped colour pair drops below WCAG 2.2 AA.
      - run: python docs/brand/contrast_check.py

  e2e:
    name: End to end — Playwright
    runs-on: ubuntu-latest
    # The suite that catches what a green unit suite cannot: fonts failing to
    # load, focus rings missing, a theme that does not apply. Four Phase 1
    # defects were only ever visible in a browser.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: dsairlines
          POSTGRES_PASSWORD: dsairlines
          POSTGRES_DB: dsairlines
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dsairlines"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      SECRET_KEY: ci-secret-key-not-used-for-anything-real-000
      DATABASE_URL: postgresql+asyncpg://dsairlines:dsairlines@localhost:5432/dsairlines
      SEED_ADMIN_EMAIL: ops@dsairlines.example
      SEED_ADMIN_PASSWORD: ci-only-password-1

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r backend/requirements.txt

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend

      - name: Migrate and seed
        working-directory: backend
        run: |
          alembic upgrade head
          python scripts/seed.py

      - name: Start the API
        working-directory: backend
        run: |
          uvicorn main:app --port 8000 --log-level warning > /tmp/api.log 2>&1 &
          for i in $(seq 1 60); do
            curl -sf http://localhost:8000/health >/dev/null && exit 0
            sleep 0.5
          done
          echo "API did not become healthy"; cat /tmp/api.log; exit 1

      - run: npx playwright install --with-deps chromium
        working-directory: frontend

      - run: npm run test:e2e
        working-directory: frontend

      - name: Upload the trace when it fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7
