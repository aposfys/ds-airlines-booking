name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend — pytest
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - run: pip install -r requirements.txt

      # The suite runs against tests/fake_mongo.py, so no database service is
      # needed. SECRET_KEY is still set explicitly: app.config refuses to
      # import without one, and relying on the pytest fallback would mean CI
      # exercised a different code path than a real deployment.
      - name: Run tests
        env:
          SECRET_KEY: ci-secret-key-not-used-for-anything-real-000
        run: pytest -q

  frontend:
    name: Frontend — lint, typecheck, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm run lint
      # `npm run build` runs `tsc -b` first, so this covers typechecking.
      - run: npm run build

  accessibility:
    name: Brand — palette contrast
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      # Fails the build if any shipped colour pair drops below WCAG 2.2 AA.
      - run: python docs/brand/contrast_check.py
