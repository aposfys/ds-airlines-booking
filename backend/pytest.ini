[pytest]
testpaths = tests
asyncio_mode = auto
# The engine and the migration fixture are session-scoped, so fixtures and
# tests must share one event loop. Without both of these, pytest-asyncio 1.x
# fails fixture setup with a bare AssertionError.
asyncio_default_fixture_loop_scope = session
asyncio_default_test_loop_scope = session
filterwarnings =
    ignore::DeprecationWarning:starlette.*
