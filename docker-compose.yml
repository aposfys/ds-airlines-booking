# Base stack. `docker compose up` also picks up docker-compose.override.yml,
# which layers on the developer conveniences (source bind-mount, hot reload).
services:
  db:
    # PostgreSQL from Phase 1 — docs/adr/0001-postgresql-over-mongodb.md
    image: postgres:17-alpine
    # Not published to the host: nothing outside the compose network needs to
    # reach the database.
    expose:
      - "5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-dsairlines}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required — copy .env.example to .env}
      POSTGRES_DB: ${POSTGRES_DB:-dsairlines}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-dsairlines} -d ${POSTGRES_DB:-dsairlines}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-dsairlines}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-dsairlines}
      # No fallback value: the app refuses to boot without a real key.
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY is required — copy .env.example to .env}
      SEED_ON_STARTUP: ${SEED_ON_STARTUP:-false}
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:-}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-}
      SQL_ECHO: ${SQL_ECHO:-false}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health').status==200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8000/api}
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  pgdata:
