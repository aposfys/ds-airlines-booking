# Base stack. `docker compose up` also picks up docker-compose.override.yml,
# which layers on the developer conveniences (source bind-mount, hot reload).
services:
  db:
    # `mongo:latest` made builds unreproducible — the image silently changed
    # major versions between builds. Pinned.
    image: mongo:7.0
    # Not published to the host: nothing outside the compose network needs to
    # reach the database, and 27017 was previously exposed without auth.
    expose:
      - "27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      MONGO_URL: mongodb://db:27017
      DB_NAME: ${DB_NAME:-dsairlines}
      # No fallback value: the app refuses to boot without a real key, which
      # is deliberate. Set it in .env (see .env.example).
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY is required — copy .env.example to .env}
      SEED_ON_STARTUP: ${SEED_ON_STARTUP:-false}
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:-}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health').status==200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8000/api}
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  mongo_data:
